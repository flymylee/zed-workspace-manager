name: Build Linux x86_64 AppImage

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release and attach the AppImage"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag (used when Create Release is checked)"
        required: false
        type: string
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-appimage-x86_64:
    name: Build x86_64 AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            file

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked || cargo build --release

      - name: Assemble AppDir & Package AppImage
        run: |
          APP_NAME="zed-workspace-manager"
          APP_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          DESK_ID="hk.sahayana.ZedWorkspaceManager"
          OUTPUT_FILE="${APP_NAME}-${APP_VERSION}-x86_64.AppImage"

          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps

          # Binary & AppRun
          cp "target/release/${APP_NAME}" AppDir/usr/bin/
          chmod +x "AppDir/usr/bin/${APP_NAME}"

          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          # Desktop entry & Icon
          cp "packaging/linux/${DESK_ID}.desktop" AppDir/
          cp "packaging/linux/${DESK_ID}.desktop" AppDir/usr/share/applications/

          cp "packaging/linux/${DESK_ID}.svg" AppDir/
          cp "packaging/linux/${DESK_ID}.svg" AppDir/usr/share/icons/hicolor/scalable/apps/
          ln -sf "${DESK_ID}.svg" AppDir/.DirIcon

          # Download appimagetool and package without requiring FUSE
          curl -fsSL -o appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage

          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "${OUTPUT_FILE}"
          echo "APPIMAGE_FILE=${OUTPUT_FILE}" >> "$GITHUB_ENV"

      - name: Upload AppImage as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE_FILE }}
          path: ${{ env.APPIMAGE_FILE }}
          retention-days: 30

      - name: Publish GitHub Release (Optional)
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Zed Workspace Manager ${{ inputs.release_tag }}"
          generate_release_notes: true
          files: |
            ${{ env.APPIMAGE_FILE }}
